# dvc.yaml — Pipeline DVC para rastreamento de dados e modelos
# Executar: dvc repro

stages:
  prepare:
    cmd: uv run prepare
    deps:
      - src/data/prepare.py
      - data/raw/events.csv
    params:
      - config/params.yaml:
          - prepare.test_size
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - data/processed/item_catalog.parquet

  experiments:
    cmd: uv run train
    deps:
      - src/experiments/
      - src/models
      - data/processed/train.parquet
      - data/processed/test.parquet
    params:
      - config/params.yaml:
          - experiment
          - models
          - weights
    outs:
      - metrics/experiment_results.json
      - models/best_model.json

  promote:
    cmd: uv run promote
    deps:
      - src/promote.py
      - models/best_model.json
